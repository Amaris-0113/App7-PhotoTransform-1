<!DOCTYPE html> <!-- Declare HTML5 document -->
<html lang="en"> <!-- Set language to English -->

<head>
  <meta charset="UTF-8"> <!-- Character encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Make app mobile-friendly -->
  <title>Photo Blue Analyzer</title> <!-- Page title -->

  <style>
    body {
      font-family: Arial, sans-serif; // Use clean, readable font
      text-align: center; // Center-align elements
    }

    canvas {
      margin: 10px;
      border: 2px solid black; // Add a black border around each canvas
    }

    #dataCanvas {
      background-color: #f0f0f0; // Slight background for second canvas
    }
  </style>
</head>

<body>
  <h1>App 7: Photo Blue Analyzer</h1> <!-- Page heading -->

  <!-- File input to upload image -->
  <input type="file" id="fileInput" accept="image/*"><br>

  <!-- First canvas: for original image -->
  <canvas id="myCanvas" width="300" height="300"></canvas>

  <!-- Second canvas: for blue-channel output -->
  <canvas id="dataCanvas" width="300" height="300"></canvas>

  <script>
    // Get references to HTML elements
    const fileInput = document.getElementById('fileInput');
    const canvas1 = document.getElementById('myCanvas');
    const canvas2 = document.getElementById('dataCanvas');
    const ctx1 = canvas1.getContext('2d');
    const ctx2 = canvas2.getContext('2d');

    // Add instructional text to second canvas initially
    ctx2.fillStyle = 'black';
    ctx2.font = '16px Arial';
    ctx2.fillText('Blue Channel Output Here', 40, 150); // Initial guide text

    // Trigger when image file is uploaded
    fileInput.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader(); // Read file as data URL

      reader.onload = function (event) {
        const img = new Image(); // Create new image
        img.onload = function () {
          // Draw image on original canvas
          ctx1.drawImage(img, 0, 0, canvas1.width, canvas1.height);

          // Get pixel data from canvas1
          const imageData = ctx1.getImageData(0, 0, canvas1.width, canvas1.height);
          const data = imageData.data;

          // Loop through pixels and zero out red and green channels
          for (let i = 0; i < data.length; i += 4) {
            data[i] = 0;     // Red channel
            data[i + 1] = 0; // Green channel
            // Blue channel (data[i+2]) stays unchanged
          }

          // Put modified image data on second canvas
          ctx2.putImageData(imageData, 0, 0);
        };
        img.src = event.target.result; // Load image source from FileReader
      };

      reader.readAsDataURL(file); // Read the selected file
    });

    // Optional: Log file last modified (from assignment)
    const docMod = document.lastModified;
    alert("This file last modified " + docMod); // Alert for last modified
    console.log("This file last modified " + docMod); // Console log
  </script>

</body>
</html>
