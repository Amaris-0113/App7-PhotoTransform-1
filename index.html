<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="utf-8">
  <title>Image Blue Channel Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- jQuery Mobile for page styling -->
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css" />
  <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>

  <script>
    // Log last modified time of this file
    console.log("Page last modified: " + document.lastModified);

    // Detect vertical squash in images (fixes some iOS canvas bugs)
    function detectVerticalSquash(img) {
      var iw = img.naturalWidth, ih = img.naturalHeight;
      var canvas = document.createElement('canvas');
      canvas.width = 1;
      canvas.height = ih;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var data = ctx.getImageData(0, 0, 1, ih).data;
      var sy = 0, ey = ih, py = ih;
      while (py > sy) {
        var alpha = data[(py - 1) * 4 + 3];
        if (alpha === 0) { ey = py; }
        else { sy = py; }
        py = (ey + sy) >> 1;
      }
      var ratio = (py / ih);
      return (ratio === 0) ? 1 : ratio;
    }

    // Safely draw an image onto canvas accounting for iOS issues
    function drawImageFixed(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) {
      var squashRatio = detectVerticalSquash(img);
      ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / squashRatio);
    }

    // When page loads, set up file upload listener
    window.onload = function () {
      var fileInput = document.getElementById('fileInput');
      var messageArea = document.getElementById('messageDisplayArea');

      fileInput.addEventListener('change', function () {
        var file = fileInput.files[0];
        var imageType = /image.*/;

        if (file.type.match(imageType)) {
          var reader = new FileReader();
          
          reader.onload = function (event) {
            messageArea.innerHTML = "Image successfully loaded!";
            var img = new Image();

            img.onload = function () {
              // Draw original image
              drawImageFixed(context1, img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 600, 500);

              // Get image data and manipulate it
              var imageData = context1.getImageData(0, 0, canvas1.width, canvas1.height);
              var data = imageData.data;

              // Remove red and green channels
              for (var i = 0; i < data.length; i += 4) {
                data[i] = 0;      // No red
                data[i + 1] = 0;  // No green
                // Keep blue (data[i + 2])
              }

              // Draw blue-only version
              context2.putImageData(imageData, 0, 0);
            };
            img.src = event.target.result; // Set source to load the image
          };
          
          reader.readAsDataURL(file);
        } else {
          messageArea.innerHTML = "Unsupported file type. Please upload an image.";
        }
      });
    }
  </script>

</head>

<body>
  <div data-role="page">
    <div data-role="header">
      <h1>Image Blue Filter</h1>
    </div>

    <div data-role="content">
      <h2>Choose an Image</h2>
      <input type="file" id="fileInput" style="background-color: #4CAF50; color: white; padding: 8px;">
      <div id="messageDisplayArea"></div>

      <!-- Canvas for Original Image -->
      <p><strong>Original Image:</strong></p>
      <canvas id="myCanvas1" width="600" height="500" style="border:1px solid #aaa;"></canvas>
      <script>
        var canvas1 = document.getElementById('myCanvas1');
        var context1 = canvas1.getContext("2d");
        context1.font = '14pt Arial';
        context1.fillText("Original image will display here.", 20, 50);
      </script>

      <!-- Canvas for Blue Channel -->
      <p><strong>Blue Channel Only:</strong></p>
      <canvas id="myCanvas2" width="600" height="500" style="border:1px solid #aaa;"></canvas>
      <script>
        var canvas2 = document.getElementById('myCanvas2');
        var context2 = canvas2.getContext("2d");
        context2.font = '14pt Arial';
        context2.fillText("Blue intensity version will display here.", 20, 50);
      </script>
    </div>

    <div data-role="footer" data-position="fixed">
      <p>DIY Diagnostics Stream - FRI</p>
    </div>
  </div>
</body>

</html>
